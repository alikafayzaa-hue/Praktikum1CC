<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Web Test - Vercel Edition</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #0f172a, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Container */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        0 0 40px rgba(56, 189, 248, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                        0 0 50px rgba(56, 189, 248, 0.2);
        }

        /* Status Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Clock Display Box */
        .time-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .time-box span {
            font-weight: 600;
            color: #38bdf8;
        }

        /* Interactive Button */
        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #7dd3fc, #0369a1);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.45);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Modal Custom Style */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            max-width: 380px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .modal h3 {
            font-size: 20px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span> Active & Online
        </div>
        
        <h1>🚀 Cloud Web Test</h1>
        <p class="subtitle">Website ini telah dimodifikasi dan berhasil berjalan secara online di Vercel Cloud Platform!</p>
        
        <div class="time-box">
            ⏰ <span id="time">Memuat waktu...</span>
        </div>

        <button class="btn" onclick="openModal()">Klik Saya</button>
    </div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h3>Selamat!</h3>
            <p>Website kamu berhasil di-deploy dan berjalan dengan lancar di Cloud Vercel!</p>
            <button class="modal-btn" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        // Modal functions
        function openModal() {
            document.getElementById("modalOverlay").classList.add("active");
        }

        function closeModal() {
            document.getElementById("modalOverlay").classList.remove("active");
        }

        // Live Clock
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            const dateString = now.toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            });
            
            document.getElementById("time").innerText = `${dateString} • ${timeString} WIB`;
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
